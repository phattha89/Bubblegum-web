<!DOCTYPE html>
<html lang="th" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUBBLEGUM COLLECTIONS</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--sf:#fff;--ink:#1c1a17;--mute:#7a746a;--gold:#a8812f;--line:#e6e0d4;--ph:#efe9dc;--h1:#f3eee3;--h2:#efe9dc;--h3:#f3eee3;--pk:#a8812f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--sf:#1b1a18;--ink:#f1ece2;--mute:#9a9486;--gold:#cfa955;--line:#2e2b26;--ph:#24211d;--h1:#24211d;--h2:#24211d;--h3:#24211d;--pk:#cfa955}}
:root[data-theme="dark"]{--bg:#121110;--sf:#1b1a18;--ink:#f1ece2;--mute:#9a9486;--gold:#cfa955;--line:#2e2b26;--ph:#24211d;--h1:#24211d;--h2:#24211d;--h3:#24211d;--pk:#cfa955}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit','Noto Sans Thai',system-ui,sans-serif;font-weight:400;line-height:1.6}
.serif{font-family:'Cormorant Garamond','Noto Serif Thai',serif}
header{text-align:center;padding:40px 20px 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px auto 24px;width:calc(100% - 40px);max-width:1040px}
.eyebrow{letter-spacing:.35em;font-size:11px;color:var(--pk);text-transform:uppercase}
h1{font-weight:400;font-size:clamp(28px,6.5vw,44px);margin:10px 0 6px}
.tag{color:var(--mute);font-size:14px;max-width:460px;margin:0 auto}
.rule{width:56px;height:1px;background:var(--gold);margin:20px auto 0}
.bar{max-width:1080px;margin:0 auto;padding:0 20px}
.search{flex:1;min-width:0;padding:12px 20px;border:1px solid var(--line);border-radius:999px;background:var(--sf);color:var(--ink);font:inherit;outline:0;margin:0}
.top{display:flex;gap:10px;align-items:center;max-width:1080px;margin:0 auto;padding:16px 20px 0}
.tb{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sw{position:relative;flex:1;min-width:0}.sw svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}.sw .search{width:100%;padding-left:44px}
.soc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1080px;margin:12px auto 0;padding:0 20px;font-size:13px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 15px 7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sf);color:var(--ink);text-decoration:none;font-size:14px;transition:.2s}
.pill svg{width:20px;height:20px;flex:none}
.pill:hover{border-color:var(--gold)}
.lk{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.lg{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--sf);color:var(--ink);transition:.2s}
.lg:hover{border-color:var(--gold);transform:scale(1.08)}
.lg svg{width:20px;height:20px}
.sr{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:16px;font-size:13px;color:var(--mute)}
.sr label{margin:0;display:inline;font-size:13px}
.sr select{width:auto;padding:8px 12px;font-size:13px}
.cd{font-size:12px;color:var(--mute);line-height:1.5;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.lay{display:flex;gap:28px;align-items:flex-start;max-width:1080px;margin:0 auto;padding:0 20px}
.main{flex:1;min-width:0}
.main .grid{max-width:none;margin:0;padding:0 0 60px;grid-template-columns:repeat(2,1fr)}
@media(min-width:820px){.main .grid{grid-template-columns:repeat(3,1fr);gap:28px 22px}}
@media(min-width:1060px){.main .grid{grid-template-columns:repeat(4,1fr)}}
.side{width:210px;flex:none;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-bottom:20px}
.si,.sh{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:var(--mute);font:inherit;font-size:14px;padding:7px 12px 7px 22px;cursor:pointer}
.si.top{padding-left:12px}
.si.on,.sh.on{color:var(--ink);border-left-color:var(--gold);font-weight:500}
.si:hover{color:var(--ink)}
.sg{margin-top:20px}
.sh,.sh0{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:500;padding-left:12px}
.sh0{padding-top:7px;padding-bottom:7px}
.mb{display:none;margin-right:auto;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);font:inherit;font-size:13px;border-radius:999px;cursor:pointer}
.mb svg{width:16px;height:16px}
.sc{display:none}
.dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 6px;color:var(--mute);display:flex;align-items:center;flex:none}
.rw{background:var(--bg)}.rw.dg{opacity:.6;background:var(--ph)}
.gz-w{margin-bottom:14px}
.gh{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:500;padding:4px 0 6px}
.gz{min-height:46px;padding:6px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.gz:empty::before{content:'วางหมวดหมู่ที่นี่';color:var(--mute);font-size:12px;text-align:center;line-height:32px}
@media(max-width:819px){.lay{display:block}.side{display:none;position:fixed;top:0;left:0;bottom:0;width:min(78vw,300px);max-height:none;background:var(--bg);z-index:15;padding:calc(24px + env(safe-area-inset-top,0px)) 14px 24px;box-shadow:6px 0 24px rgba(0,0,0,.25)}.side.open{display:block}.sc.open{display:block;position:fixed;inset:0;background:rgba(10,9,8,.45);z-index:14}.mb{display:inline-flex}}

.buy{display:flex;align-items:center;justify-content:center;gap:8px}.buy svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);padding:7px 18px;font:inherit;font-size:13px;cursor:pointer;border-radius:999px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;max-width:1080px;margin:0 auto;padding:0 20px 60px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:28px 22px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{cursor:pointer;background:var(--sf);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.25s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.im{aspect-ratio:1;background:var(--ph);display:flex;align-items:center;justify-content:center;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im span{font-size:44px;font-weight:500;color:var(--gold);opacity:.7}
.ci{padding:12px 12px 14px}
.cat{font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.nm{font-size:14px;font-weight:400;margin:2px 0 4px;line-height:1.4}
.pr{font-size:17px;font-weight:500;color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
footer{text-align:center;color:var(--mute);font-size:12px;padding:30px 20px 40px;border-top:1px solid var(--line)}
footer button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;text-decoration:underline;margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(10,9,8,.6);display:none;align-items:flex-end;justify-content:center;z-index:9;padding-top:env(safe-area-inset-top,0px)}
.ov.show{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.md{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));position:relative}
.x{position:absolute;top:10px;right:14px;background:none;border:0;font-size:26px;color:var(--mute);cursor:pointer}
.md .im{margin:8px 0 16px}
.md h2{font-weight:500;font-size:24px;margin:2px 0}.md .im{border-radius:14px}
.desc{color:var(--mute);font-size:14px;white-space:pre-wrap;margin:10px 0 18px}
.buy{display:block;text-align:center;padding:13px;margin-top:10px;border-radius:12px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;font-size:14px;font-weight:400;transition:.2s}
.buy:hover{background:var(--ink);color:var(--bg)}
.lbl{font-size:11px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-top:6px}
label{display:block;font-size:12px;color:var(--mute);margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--sf);color:var(--ink);font:inherit;font-size:14px;border-radius:10px}
.lr{display:flex;gap:6px;margin-bottom:6px}.lr select{width:38%;flex:none}
.btn{padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-size:14px;cursor:pointer;border-radius:12px}
.btn.o{background:transparent;color:var(--ink);border-color:var(--ink)}
.row{display:flex;gap:8px;margin-top:20px}.row .btn{flex:1}
.ad{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ad button{background:none;border:0;color:var(--gold);cursor:pointer;font:inherit}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:13px;display:none;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toast" style="display: none;">กำลังบันทึก…</div>

function dragSort(box,done){
  box.querySelectorAll('.dh').forEach(h=>{
    h.onpointerdown=e=>{
      e.preventDefault();
      const row=h.closest('.rw'),md=$('md');let moved=false;
      row.classList.add('dg');md.setPointerCapture(e.pointerId);
      md.onpointermove=ev=>{
        const m=md.getBoundingClientRect();
        if(ev.clientY<m.top+50)md.scrollTop-=14;else if(ev.clientY>m.bottom-50)md.scrollTop+=14;
        const el=document.elementFromPoint(ev.clientX,ev.clientY);if(!el)return;
        const r=el.closest('.rw');
        if(r){if(r===row||!box.contains(r))return;const b=r.getBoundingClientRect(),after=ev.clientY>b.top+b.height/2,ref=after?r.nextSibling:r;
          if(ref!==row&&r[after?'nextSibling':'previousSibling']!==row){r.parentNode.insertBefore(row,ref);moved=true}return}
        const w=el.closest('.gz-w');
        if(w&&box.contains(w)){const z=w.querySelector('.gz');
          if(el.closest('.gh')){if(z.firstElementChild!==row){z.insertBefore(row,z.firstChild);moved=true}}
          else{const o=[...z.querySelectorAll('.rw')].filter(x=>x!==row);
            if(!o.length||ev.clientY>o[o.length-1].getBoundingClientRect().bottom){if(z.lastElementChild!==row){z.appendChild(row);moved=true}}}}
      };
      const end=()=>{md.onpointermove=md.onpointerup=md.onpointercancel=null;try{md.releasePointerCapture(e.pointerId)}catch(_){}row.classList.remove('dg');if(moved)done()};
      md.onpointerup=end;md.onpointercancel=end;
    };
  });
}
